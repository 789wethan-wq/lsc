[project]
name = "lsc"
version = "0.1.0"
description = "Latent-State Structural Change Detection Framework"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "statsmodels",
    "hmmlearn",
    "ruptures",
    "matplotlib",
    "pyyaml",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lsc*"]
