# M5 grid v2a — T sweep at SNR 0.5 (hypotheses pre-registered in
# experiments/CHANGELOG.md, 2026-07-11 entry). T=500 reference numbers
# come from grid_v1; this config adds the short (T=200, 50 training
# obs) and long (T=2000) ends.
experiment: grid_v2_T
out_dir: paper_assets
n_reps: 500
far_target: 0.05
train_frac: 0.25

seeds:
  calibration: 100000
  evaluation: 200000
  far_check: 300000
  feature_scales: 900000

T_values: [200, 2000]

arenas:
  ar1_snr0.5: {dgp: AR1StateDGP, phi: 0.95, q: 0.04875, r: 1.0, kalman_spec: ar1}

scenarios:
  level_3s: {kind: level, time_frac: 0.5, magnitude: 3.0}
  variance_x1.5: {kind: variance, time_frac: 0.5, vol_mult: 1.5}
  variance_x3: {kind: variance, time_frac: 0.5, vol_mult: 3.0}
  persistence_up: {kind: persistence, time_frac: 0.5, new_phi: 0.995}
  persistence_down: {kind: persistence, time_frac: 0.5, new_phi: 0.80}

methods: [lsc_composite, lsc_kalman_cusum, lsc_state_cusum, raw_cusum]
