# grid_v9b r-channel at phi in {0.5, 0.8} — SPEC R5 M1 (pre-registered
# in experiments/CHANGELOG.md 2026-07-26 BEFORE this config was run).
#
# Extends Table 3b's phi=0.99 single point to a full sweep matching
# Table 4/Fig. 2's level-shift phi-sweep (phi in {0.5, 0.8, 0.95, 0.99}).
# phi=0.95 already published (grid_v4_varbench_core) and phi=0.99
# already published (grid_v9_r_phi99, R2 this round) -- only phi=0.5
# and phi=0.8 are genuinely new. q values IDENTICAL to
# grid_v6_phisweep's phi=0.5/0.8 rows (q = SNR*(1-phi^2)*r), so cells
# are draw-for-draw comparable to the existing level-shift phi-sweep at
# the same phi/SNR combinations.
experiment: grid_v9b_r_phi_lo
out_dir: paper_assets
n_reps: 500
far_target: 0.05
train_frac: 0.25

seeds:
  calibration: 100000
  evaluation: 200000
  far_check: 300000
  feature_scales: 900000

T_values: [500]

arenas:
  ar1_phi0.5_snr0.1: {dgp: AR1StateDGP, phi: 0.5, q: 0.075, r: 1.0, kalman_spec: ar1}
  ar1_phi0.5_snr0.5: {dgp: AR1StateDGP, phi: 0.5, q: 0.375, r: 1.0, kalman_spec: ar1}
  ar1_phi0.5_snr2.0: {dgp: AR1StateDGP, phi: 0.5, q: 1.5,   r: 1.0, kalman_spec: ar1}
  ar1_phi0.8_snr0.1: {dgp: AR1StateDGP, phi: 0.8, q: 0.036, r: 1.0, kalman_spec: ar1}
  ar1_phi0.8_snr0.5: {dgp: AR1StateDGP, phi: 0.8, q: 0.18,  r: 1.0, kalman_spec: ar1}
  ar1_phi0.8_snr2.0: {dgp: AR1StateDGP, phi: 0.8, q: 0.72,  r: 1.0, kalman_spec: ar1}

scenarios:
  variance_x1.5: {kind: variance, time_frac: 0.5, vol_mult: 1.5}
  variance_x3: {kind: variance, time_frac: 0.5, vol_mult: 3.0}

methods: [raw_var_cusum, arima_var_cusum]
